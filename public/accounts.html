<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css"><title>SabHisab - Accounts</title></head>
<body><div class="app"><aside class="sidebar">
<div class="logo"><h1>SabHisab</h1><p>Personal Finance</p></div>
<nav class="sidebar-nav">
<a href="index.html">Dashboard</a>
<a href="transactions.html">Transactions</a>
<a href="budgets.html">Budgets</a>
<a href="goals.html">Goals</a>
<a href="accounts.html">Accounts</a>
<a href="reports.html">Reports</a>
<a href="settings.html">Settings</a>
</nav>
</aside><div class="main-area"><header class="topbar">
<div><p class="welcome-label">Financial Overview</p><h2>Welcome, <span data-user-name></span> 👋</h2></div>
<div class="profile"><div class="profile-avatar" data-user-initials></div><span data-user-name></span></div>
</header>
<main class="page-container">
<section class="page-header"><div><p class="eyebrow">Money sources</p><h1>Accounts</h1><p class="page-description">Manage the accounts used by your transactions.</p></div><a href="#account-modal" class="primary-button">+ Add Account</a></section>
<section class="account-grid" id="account-list"></section>
</main></div></div>

<div id="account-modal" class="modal"><div class="modal-backdrop"></div><div class="modal-content">
<div class="modal-header"><div><p class="eyebrow">Money source</p><h2>Add Account</h2></div><a href="#" class="modal-close">×</a></div>
<form id="account-form">
<div class="form-group"><label>Name</label><input name="name" placeholder="e.g. HDFC Bank" required></div>
<div class="form-group"><label>Type</label><select name="type"><option value="bank">Bank Account</option><option value="cash">Cash</option><option value="card">Credit Card</option></select></div>
<div class="form-group"><label>Opening Balance</label><input name="balance" type="number" step="0.01" value="0"></div>
<div class="form-actions"><a href="#" class="secondary-button">Cancel</a><button class="primary-button">Add Account</button></div>
</form></div></div>
<script src="js/app.js"></script><script src="js/accounts.js"></script>
</body></html>
