<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SabHisab - Login</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body class="auth-page">
<main class="auth-card card">
    <div class="logo auth-logo"><h1>SabHisab</h1><p>Personal Finance</p></div>

    <div class="auth-tabs">
        <button class="tab active" data-mode="login">Login</button>
        <button class="tab" data-mode="register">Register</button>
    </div>

    <form id="auth-form">
        <div class="form-group register-only hidden">
            <label>Name</label>
            <input id="name" type="text">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input id="email" type="email" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input id="password" type="password" minlength="8" required>
        </div>

        <button class="primary-button full" type="submit" id="auth-submit">Login</button>
        <p id="auth-error" class="form-error"></p>
    </form>
</main>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
