<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/responsive.css"><title>SabHisab - Goals</title></head>
<body><div class="app"><aside class="sidebar">
<div class="logo"><h1>SabHisab</h1><p>Personal Finance</p></div>
<nav class="sidebar-nav">
<a href="index.html">Dashboard</a>
<a href="transactions.html">Transactions</a>
<a href="budgets.html">Budgets</a>
<a href="goals.html">Goals</a>
<a href="accounts.html">Accounts</a>
<a href="reports.html">Reports</a>
<a href="settings.html">Settings</a>
</nav>
</aside><div class="main-area"><header class="topbar">
<div><p class="welcome-label">Financial Overview</p><h2>Welcome, <span data-user-name></span> 👋</h2></div>
<div class="profile"><div class="profile-avatar" data-user-initials></div><span data-user-name></span></div>
</header>
<main class="page-container">
<section class="page-header"><div><p class="eyebrow">Future planning</p><h1>Financial Goals</h1><p class="page-description">Track what you are saving for.</p></div><a href="#goal-modal" class="primary-button">+ New Goal</a></section>
<section class="goal-grid" id="goal-list"></section>
</main></div></div>

<div id="goal-modal" class="modal"><div class="modal-backdrop"></div><div class="modal-content">
<div class="modal-header"><div><p class="eyebrow">Savings target</p><h2>New Goal</h2></div><a href="#" class="modal-close">×</a></div>
<form id="goal-form">
<div class="form-group"><label>Name</label><input name="name" required></div>
<div class="form-row"><div class="form-group"><label>Target Amount</label><input name="target_amount" type="number" min="1" required></div><div class="form-group"><label>Already Saved</label><input name="saved_amount" type="number" min="0" value="0"></div></div>
<div class="form-group"><label>Target Date</label><input name="target_date" type="date"></div>
<div class="form-actions"><a href="#" class="secondary-button">Cancel</a><button class="primary-button">Create Goal</button></div>
</form></div></div>
<script src="js/app.js"></script><script src="js/goals.js"></script>
</body></html>
